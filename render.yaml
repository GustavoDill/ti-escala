services:
  - type: web
    name: ti-escala
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: escala
      - key: SUPABASE_FILE_PATH
        value: escala.csv
      - key: SUPABASE_AUTH_TABLE
        value: escala_auth

